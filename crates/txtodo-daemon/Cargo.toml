[package]
name = "txtodo-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "txtodod: actors, watcher, IPC server, MCP host."

[[bin]]
name = "txtodod"
path = "src/main.rs"

[dependencies]
txtodo-core.workspace = true
txtodo-query.workspace = true
txtodo-model.workspace = true
txtodo-store.workspace = true
txtodo-crdt.workspace = true
txtodo-sync.workspace = true
txtodo-proto.workspace = true
txtodo-mcp.workspace = true
# https://docs.rs/getrandom — the 80 random bits of a ULID
getrandom = "0.3"
# https://docs.rs/tokio — one actor task per document, bounded channels, unix socket listener
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal", "fs"] }
# https://docs.rs/tokio-stream — UnixListenerStream for tonic, ReceiverStream for Watch
tokio-stream = { version = "0.1", features = ["net"] }
# https://docs.rs/tonic — the gRPC server on the socket (ADR 0006)
tonic = "0.14"
# https://docs.rs/blake3 — projection hashes, 32 bytes, fast
blake3 = "1"
# https://docs.rs/humantime — RFC 3339 parse/format for a token's `expires` field (design §6.2)
humantime = "2"
# https://docs.rs/notify — FSEvents / inotify / ReadDirectoryChangesW (plan M3 watcher)
notify = "8"
# https://docs.rs/tracing — span reconcile{file} and structured events (plan §5)
tracing = "0.1"
# https://docs.rs/tracing-subscriber — JSON layer + TXTODO_LOG env filter
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# https://docs.rs/tracing-appender — daily files under .txtodo/logs/, non-blocking writer
tracing-appender = "0.2"

[dev-dependencies]
# https://docs.rs/proptest — text-edit application inverts diff_text
proptest = "1"
# https://docs.rs/criterion — reconcile one edit in 10k lines (budgets.json.latencyMs)
criterion = "0.5"
# https://docs.rs/hyper-util — TokioIo adapter so a tonic client can dial the unix socket in tests
hyper-util = "0.1"
# https://docs.rs/tower — service_fn for the custom connector
tower = { version = "0.5", features = ["util"] }
# https://docs.rs/tempfile — every test gets its own workspace dir
tempfile = "3"

[[bench]]
name = "reconcile"
harness = false

[lints]
workspace = true
