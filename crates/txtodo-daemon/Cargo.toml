[package]
name = "txtodo-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "txtodod: actors, watcher, IPC server, MCP host."

[[bin]]
name = "txtodod"
path = "src/main.rs"

[dependencies]
txtodo-core.workspace = true
txtodo-query.workspace = true
txtodo-model.workspace = true
txtodo-workspace-paths.workspace = true
txtodo-store.workspace = true
txtodo-crdt.workspace = true
txtodo-sync.workspace = true
txtodo-proto.workspace = true
txtodo-mcp.workspace = true
txtodo-telemetry.workspace = true
# https://docs.rs/getrandom — the 80 random bits of a ULID
getrandom = "0.3"
# https://docs.rs/tokio — one actor task per document, bounded channels, unix socket listener
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal", "fs"] }
# https://docs.rs/tokio-stream — UnixListenerStream for tonic, ReceiverStream for Watch
tokio-stream = { version = "0.1", features = ["net"] }
# https://docs.rs/tonic — the gRPC server on the socket (ADR 0006)
tonic = "0.14"
# https://docs.rs/blake3 — projection hashes, 32 bytes, fast
blake3 = "1"
# https://docs.rs/humantime — RFC 3339 parse/format for a token's `expires` field (design §6.2)
humantime = "2"
# https://docs.rs/notify — FSEvents / inotify / ReadDirectoryChangesW (plan M3 watcher)
notify = "8"
# https://docs.rs/tracing — span reconcile{file} and structured events (plan §5)
tracing = "0.1"
# https://docs.rs/tracing-subscriber — JSON layer + TXTODO_LOG env filter
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# https://docs.rs/tracing-appender — daily files under .txtodo/logs/, non-blocking writer
tracing-appender = "0.2"
# https://docs.rs/serde_json — the pair_accept `code` wire format (plan M4 gRPC exposure)
serde_json = "1"
pathfinding = "4.16.0"
strsim = "0.11.1"
# https://docs.rs/argon2 — RFC 9106 KDF for the bundle passphrase wrap (plan M8 `cli-bundle`); same
# crate/version already vetted via txtodo-sync's FileKeyStore (deny.toml already covers it).
argon2 = "0.5"
# https://docs.rs/chacha20poly1305 — XChaCha20-Poly1305; `stream` enables the STREAM AEAD
# construction (`aead::stream::{EncryptorBE32, DecryptorBE32}`) a bundle needs to seal its body in
# bounded chunks rather than one giant blob. Same crate/version already vetted via txtodo-sync.
chacha20poly1305 = { version = "0.10", features = ["getrandom", "stream"] }
# https://docs.rs/postcard — the bundle's own record framing (same codec txtodo-store already uses
# for the ops.payload column); this crate has no prior direct dependency on it.
postcard = { version = "1", features = ["alloc"] }
# https://docs.rs/data-encoding — base32 for the compact `pair_accept` code (task
# `pairing-code-compact`); same crate/version txtodo-sync's own offer.rs already uses.
data-encoding = "2"
# https://docs.rs/serde — derives for the bundle's own wire records (bundle_wire.rs)
serde = { version = "1", features = ["derive"] }
# https://docs.rs/prost — encodes BundleManifest to bytes for the bundle's clear header frame
prost = "0.14"

[dev-dependencies]
# https://docs.rs/proptest — text-edit application inverts diff_text
proptest = "1"
# https://docs.rs/criterion — reconcile one edit in 10k lines (budgets.json.latencyMs)
criterion = "0.5"
# https://docs.rs/hyper-util — TokioIo adapter so a tonic client can dial the unix socket in tests
hyper-util = "0.1"
# https://docs.rs/tower — service_fn for the custom connector
tower = { version = "0.5", features = ["util"] }
# https://docs.rs/tempfile — every test gets its own workspace dir
tempfile = "3"
# The reference relay's own opaque blob store (plan M8 `relay-converge-test`, item 8): a real
# `relay::store::Store`, so `relay_converge.rs`'s opacity assertion stores real sealed ciphertext
# in the real relay crate rather than re-deriving its guarantees by inspection. Dev-only — never a
# production dependency (the two binaries never talk to each other; see that test's module doc).
relay = { path = "../../relay" }

[[bench]]
name = "reconcile"
harness = false

[lints]
workspace = true
