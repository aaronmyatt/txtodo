[package]
name = "txtodo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "parse, tokenize, model, format, diff for todo.txt lines. Sync, no I/O."

[lints]
workspace = true

[features]
default = ["std"]
std = []

[dev-dependencies]
abnf = "0.13"
abnf_to_pest = "0.5"
criterion = "0.5"
pest = "2"
pest_derive = "2"
pretty = "0.12"
proptest = "1"
serde_json = "1"

[[bench]]
name = "parse"
harness = false
