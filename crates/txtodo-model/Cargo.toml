[package]
name = "txtodo-model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Workspace tree, task ids, HLC, op types."

[dependencies]
txtodo-core.workspace = true
# https://serde.rs — derives on every op type; postcard is the one payload codec (plan M4 wire, M3 store)
serde = { version = "1", features = ["derive"] }
# https://docs.rs/postcard — compact, no_std-friendly serde format
postcard = { version = "1", features = ["alloc"] }
# https://docs.rs/tracing — event/span emission only; this low-level crate never wires a subscriber
tracing = "0.1"

[dev-dependencies]
# https://docs.rs/proptest — Hlc total order and monotone tick
proptest = "1"
# https://docs.rs/tracing-subscriber — test-only local JSON capture for `hlc_no_secrets_tests.rs`
# (root todo.txt `logging-flow-test`); this crate may not depend on `txtodo-telemetry`
# (`.claude/budgets.json`'s `allowedDeps` — see tasks/logging-flow-test/notes.md), so the same
# `LogSink`/`capturing_dispatch` shape is reimplemented locally against the shared workspace pin.
tracing-subscriber = { workspace = true }
# https://docs.rs/serde_json — parses the captured JSON lines back out to inspect field names.
serde_json = "1"

[lints]
workspace = true
