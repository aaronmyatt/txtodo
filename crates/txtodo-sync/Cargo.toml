[package]
name = "txtodo-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sync protocol, transports, pairing, crypto."

[dependencies]
txtodo-model.workspace = true
txtodo-store.workspace = true
# https://serde.rs — derives on every wire message; the same derives txtodo-model already carries
serde = { version = "1", features = ["derive"] }
# https://docs.rs/postcard — the one payload codec (model, store BLOB, and now the wire)
postcard = { version = "1", features = ["alloc"] }
# https://docs.rs/ed25519-dalek — device identity signatures over Op::signing_bytes (RFC 8032)
ed25519-dalek = "2"
# https://docs.rs/chacha20poly1305 — XChaCha20-Poly1305 batch encryption on the wire
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
# https://docs.rs/getrandom — the OS CSPRNG, called directly so a nonce never comes from a seeded PRNG
getrandom = "0.3"

[dev-dependencies]
# https://docs.rs/proptest — want(local, remote) requests exactly the missing ops
proptest = "1"

[lints]
workspace = true
