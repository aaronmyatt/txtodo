[package]
name = "txtodo-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sync protocol, transports, pairing, crypto."

[dependencies]
txtodo-model.workspace = true
txtodo-store.workspace = true
# https://serde.rs — derives on every wire message; the same derives txtodo-model already carries
serde = { version = "1", features = ["derive"] }
# https://docs.rs/postcard — the one payload codec (model, store BLOB, and now the wire)
postcard = { version = "1", features = ["alloc"] }
# https://docs.rs/ed25519-dalek — device identity signatures over Op::signing_bytes (RFC 8032)
ed25519-dalek = "2"
# https://docs.rs/chacha20poly1305 — XChaCha20-Poly1305 batch encryption on the wire
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
# https://docs.rs/getrandom — the OS CSPRNG, called directly so a nonce never comes from a seeded PRNG
getrandom = "0.3"
# https://docs.rs/keyring — OS keystore: macOS Keychain, Windows Credential Manager, Linux Secret
# Service. `async-secret-service` (zbus, pure Rust) instead of `sync-secret-service` (the `dbus`
# crate's libdbus-sys C binding, which needs a system libdbus-dev + pkg-config CI does not carry);
# keyring's `Entry` API is synchronous regardless of which backend feature is chosen.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust"] }
# https://docs.rs/argon2 — RFC 9106 KDF for the encrypted-file keystore fallback
argon2 = "0.5"
# https://docs.rs/zeroize — `Secret` is wiped on drop; keys never linger in freed memory
zeroize = "1"
# https://docs.rs/x25519-dalek — the pairing ECDH handshake (plan M4 `sync-pairing`)
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
# https://docs.rs/rand_core — x25519-dalek's ephemeral-key RNG bound; OsRng draws from the OS CSPRNG
rand_core = { version = "0.6", features = ["getrandom"] }
# https://docs.rs/hkdf — RFC 5869; derives the SAS and the key-wrap key from the pairing transcript
hkdf = "0.12"
# https://docs.rs/sha2 — the hash HKDF-SHA256 runs over
sha2 = "0.10"
# https://docs.rs/data-encoding — base32 for `txtodo pair <code>`'s text form of the QR payload
data-encoding = "2"
# https://docs.rs/iroh — LAN QUIC transport (plan M4 `sync-lan-transport`); relay support (M8) is
# the same dependency, so this crate needs only one p2p library across both milestones.
iroh = "1"
# https://docs.rs/mdns-sd — `_txtodo._udp` discovery; no async runtime dependency of its own (runs
# its own thread), so it does not force tokio on anything that never touches the LAN transport.
mdns-sd = "0.21"
# https://docs.rs/tokio — iroh's endpoint/connection API is async; the daemon already runs tokio,
# this crate's own transport code needs a runtime handle to drive it.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[dev-dependencies]
# https://docs.rs/proptest — want(local, remote) requests exactly the missing ops
proptest = "1"

[lints]
workspace = true
