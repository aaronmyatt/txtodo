// txtodo local IPC (ADR 0006): one schema, gRPC on the unix socket now, a REST mirror later.
// Language guide: https://protobuf.dev/programming-guides/proto3/
// Every field is optional in proto3; adding fields is compatible, renumbering is not.
syntax = "proto3";

package txtodo.v1;

service Txtodo {
  // Every synced document with its current projection hash.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // The exact bytes the daemon holds for one document.
  rpc GetFile(GetFileRequest) returns (FileContents);
  // A change per reconcile or apply, for the requested paths (all when empty).
  rpc Watch(WatchRequest) returns (stream Change);
  // Intent-level mutations; the daemon turns them into ops.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  // Ops newest first, filtered by path and/or task.
  rpc History(HistoryRequest) returns (HistoryResponse);
  // Appends inverse ops for the newest `steps` ops of a document.
  rpc Undo(UndoRequest) returns (ApplyResponse);
  // Renders a document as it was at a moment in time.
  rpc Checkout(CheckoutRequest) returns (FileContents);
  // Liveness for `txtodo doctor` and tests.
  rpc Health(HealthRequest) returns (HealthResponse);
  // Open needs_review flags for a document (plan M4): two devices rewrote the same word.
  rpc ListConflicts(ConflictsRequest) returns (ConflictsResponse);
  // Resolves one flag: writes the chosen side back (mine/theirs) or keeps the file (merged),
  // and clears the flag — both or neither.
  rpc ResolveConflict(ResolveRequest) returns (ApplyResponse);

  // notes.md for one task's ref: directory (plan M5, design §7). The daemon resolves the task
  // to its ref dir; the client never resolves a slug or touches the filesystem itself.
  rpc GetNotes(TaskRef) returns (NotesDoc);
  // Applies one edit to notes.md as a Loro NotesEdit op; lazily creates the ref: directory (and
  // the task's `ref:` tag) on the first edit when neither exists yet (plan §3.2.4).
  rpc EditNotes(NotesEditRequest) returns (ApplyResponse);

  // Resolves (or, with `ensure`, lazily creates) one line's ref: directory (plan M5, specs
  // rules 2, 4, 9). Read-only when `ensure` is false — never creates a tag or a directory
  // (`txtodo open`'s negative-space requirement); with `ensure` true, mints a tag+directory on
  // a ref-less line exactly like the first notes.md/sub-list write would. Also resolves the
  // line's authoritative task id, which sidecar-mode text never carries.
  rpc RefDir(RefDirRequest) returns (RefDirInfo);
  // Lists workspace directories no `ref:` tag points to (rule 10); deletes them only when
  // `execute` is set. `txtodo prune --orphans` (list) / `--orphans --yes` (execute).
  rpc PruneOrphans(PruneOrphansRequest) returns (PruneOrphansResponse);

  // Starts a pairing handshake on this device and returns the QR payload (plan M4, design §4).
  rpc PairOffer(PairOfferRequest) returns (PairOfferResponse);
  // Accepts a peer's scanned PairOffer and begins the X25519 handshake; returns the 6-word SAS.
  rpc PairAccept(PairAcceptRequest) returns (PairResult);
  // Confirms the SAS shown to the human on this device. The group key lands only once both
  // sides have confirmed (never on one-sided trust).
  rpc PairConfirmSas(PairConfirmRequest) returns (PairResult);

  // Mints a new capability token from the design §6.2 scope/caveat grammar.
  rpc TokenCreate(TokenCreateRequest) returns (Token);
  // Lists tokens for this workspace, scopes included (never secret material).
  rpc TokenList(TokenListRequest) returns (TokenListResponse);
  // Revokes a token; the daemon refuses it on its next use.
  rpc TokenRevoke(TokenRevokeRequest) returns (TokenRevokeResponse);

  // Streams the op log (ADR 0004) newest-first for the devices/agents activity feed.
  rpc OpLogStream(OpLogRequest) returns (stream OpLogEntry);

  // Devices paired into this workspace's sync group (plan M4 tasks/sync-device-remove). Removed
  // rows are kept, tombstoned like every other table in txtodo-store, not deleted.
  rpc DeviceList(DeviceListRequest) returns (DeviceListResponse);
  // Removes a device and rotates the group key to the remaining devices (plan M4
  // tasks/sync-device-remove). Refuses removing this device itself or the last device; removing
  // an already-removed device rotates nothing and says so.
  rpc DeviceRemove(DeviceRemoveRequest) returns (DeviceRemoveResponse);

  // TEST-ONLY (plan M4 `sync-lan-transport`): forces this workspace's sync group id and epoch-0
  // group key directly, bypassing the pairing handshake. Refused with UNIMPLEMENTED unless the
  // daemon was started with TXTODO_TEST_HOOKS=1 — real pairing has no transport over the LAN
  // link yet, so a real two-daemon test needs a scripted seam instead of a TTY SAS prompt; this
  // is that seam, guarded so it can never run in production.
  rpc DebugSetGroupKey(DebugSetGroupKeyRequest) returns (DebugSetGroupKeyResponse);
}

message ListFilesRequest {}

// done/total task-line counts for a todo.txt (plan §3.2.5). Unset (both 0) for done.txt/notes.md.
message Progress {
  uint32 done = 1;
  uint32 total = 2;
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_TODO = 1;
  FILE_KIND_DONE = 2;
  FILE_KIND_NOTES = 3;
}

message FileInfo {
  string path = 1;      // workspace-relative, `/` separators
  bytes hash = 2;       // blake3 of the projection, 32 bytes
  FileKind kind = 3;
  // done = completed lines in this todo.txt + task lines in the sibling done.txt; total = task
  // lines in both, blanks excluded (plan §3.2.5). Unset for done.txt/notes.md rows.
  Progress progress = 4;
}

message ListFilesResponse {
  repeated FileInfo files = 1;
  // The same files, shaped as a tree of ref: directories with rule-5 progress per node (plan M5,
  // tasks/proto-tree-progress). A projection of `files`, not a second source of truth.
  TreeNode tree = 2;
}

// One node of the workspace tree (plan M5, specs/ref-directories.md rule 2): the workspace root
// (dir = "") or a ref: directory. `progress` is rule 5's non-recursive done/total for this node's
// own todo.txt + sibling done.txt. `owner_task_id` is the task whose ref: tag points here; empty
// for the root and for an orphan (rule 10, `PruneOrphans`). `files` are this node's own rows
// (whichever of todo.txt/done.txt/notes.md exist); `children` are its ref: sub-directories.
message TreeNode {
  string dir = 1;
  Progress progress = 2;
  string owner_task_id = 3;
  repeated FileInfo files = 4;
  repeated TreeNode children = 5;
}

message GetFileRequest { string path = 1; }

message FileContents {
  string path = 1;
  bytes bytes = 2;
  bytes hash = 3;
}

message WatchRequest { repeated string paths = 1; }

message OpSummary {
  int64 seq = 1;
  string op_id = 2;         // ULID text
  uint64 hlc_wall_ms = 3;
  uint32 hlc_counter = 4;
  string device = 5;        // ULID text
  string principal = 6;     // "you@dev" / "agent:name@dev" / "external@dev"
  string kind = 7;          // store kind tag: insert, set_field, edit_text, move, ...
  string task_id = 8;       // ULID text, empty for blank ops
  string summary = 9;       // one-line human summary, truncated by the daemon
}

// One needs_review flag: the description each side had when they diverged (plan M4).
message ReviewFlag {
  string task_id = 1;         // ULID text
  uint32 line_number = 2;     // 1-based line the task sits on now; 0 when it is no longer in the file
  string mine = 3;            // this device's description at flag time
  string theirs = 4;          // the peer's description at flag time
  uint64 raised_at_ms = 5;
}

message Change {
  string path = 1;
  bytes hash = 2;
  repeated OpSummary ops = 3;
  repeated ReviewFlag review = 4;   // flags raised by this change (an import), if any
  // This ref's fresh rule-5 progress when `path` is a todo.txt the change could have affected
  // (plan M5, tasks/proto-tree-progress); unset otherwise. Never a second source of truth: the
  // same number `ListFiles` would return for this node right now.
  Progress progress = 5;
}

message ConflictsRequest { string path = 1; }

message ConflictsResponse { repeated ReviewFlag flags = 1; }

// Which side wins. `MERGED` keeps what is in the file and only clears the flag.
enum Resolution {
  RESOLUTION_UNSPECIFIED = 0;
  RESOLUTION_MINE = 1;
  RESOLUTION_THEIRS = 2;
  RESOLUTION_MERGED = 3;
}

message ResolveRequest {
  string path = 1;
  TaskRef task = 2;
  Resolution resolution = 3;
}

// A line addressed two ways; the daemon rejects the mutation when they disagree (stale client).
message TaskRef {
  uint32 line_number = 1;   // 1-based over every line, blanks included
  string task_id = 2;       // ULID text; empty when the line has no id yet
}

message Add { string line = 1; }                          // full line text, no ending; id added if missing
message Complete { TaskRef task = 1; string today = 2; }  // YYYY-MM-DD in the client's local zone (ADR 0011)
message Edit { TaskRef task = 1; string new_line = 2; }  // whole-line replacement; the daemon derives field ops
message Move { TaskRef task = 1; string to_path = 2; }
message Delete { TaskRef task = 1; bool leave_blank = 2; } // todo.sh leaves a blank line by default

message Mutation {
  oneof kind {
    Add add = 1;
    Complete complete = 2;
    Edit edit = 3;
    Move move = 4;
    Delete delete = 5;
  }
}

// Who is applying. M3 knows users only; M6 fills `agent`.
message AgentPrincipal {
  string token_id = 1;
  string name = 2;
}

message ApplyRequest {
  string path = 1;
  repeated Mutation mutations = 2;
  AgentPrincipal agent = 3;   // unset = the user on this device
}

message ApplyResponse {
  uint32 applied = 1;         // ops appended
  bytes hash = 2;             // projection hash after the write
  uint64 hlc_wall_ms = 3;
  uint32 hlc_counter = 4;
}

message HistoryRequest {
  string path = 1;            // empty = every document
  string task_id = 2;         // empty = every task
  uint32 limit = 3;           // 0 = daemon default
  int64 before_seq = 4;       // 0 = newest
}

message HistoryResponse { repeated OpSummary ops = 1; }

message UndoRequest {
  string path = 1;
  uint32 steps = 2;           // 0 = 1
}

message CheckoutRequest {
  string path = 1;
  uint64 at_wall_ms = 2;      // inclusive upper bound on hlc wall time
}

message HealthRequest {}

message HealthResponse {
  bool watcher_alive = 1;
  uint32 documents = 2;
  uint64 last_event_age_ms = 3;
  uint64 started_at_ms = 4;
  uint64 writes_total = 5;
  string version = 6;
  // The resolved sync keystore backend (plan M4 tasks/sync-keystore): "os" or "file". A human
  // should be able to answer "where are my keys?" from `txtodo doctor` without reading code.
  string key_store_backend = 7;
  // LAN transport (plan M4 `sync-lan-transport`), for `txtodo doctor` — a human should see
  // whether sync is even possible without reading code.
  bool lan_relay_disabled = 8;    // always true today (M8 turns this on deliberately)
  bool lan_endpoint_bound = 9;    // the iroh endpoint bound and is accepting connections
  bool lan_discovery_active = 10;  // mDNS is advertising and browsing for this group
  bool lan_group_key_present = 11; // this workspace has a group key to sync with (paired)
}

// --- notes.md (plan M5, design §7) ---

message NotesDoc {
  string path = 1;        // workspace-relative <ref>/notes.md; absent (empty) until first write
  bytes bytes = 2;         // current markdown bytes; empty when the file does not exist yet
  bytes hash = 3;
}

message NotesEditRequest {
  TaskRef task = 1;        // the line whose ref: directory owns the notes.md
  string new_text = 2;     // whole-document replacement; the daemon derives the Loro text ops
}

// --- ref: directories (plan M5, specs/ref-directories.md) ---

message RefDirRequest {
  string path = 1;
  TaskRef task = 2;
  bool ensure = 3;   // false = read-only resolve; true = lazily create like the first write would
}

// A line's ref: directory, resolved or (with `ensure`) created.
message RefDirInfo {
  string task_id = 1;     // resolved ULID, authoritative even in sidecar mode (no id: tag in text)
  string slug = 2;        // the existing tag's slug, or the slug creation would/did use
  string dir = 3;         // workspace-relative directory path for that slug
  bool has_ref_tag = 4;   // true when the line already carries a ref: tag (even if dangling)
  bool dir_exists = 5;    // true when `dir` is present on disk (after this call, if `ensure`)
}

message PruneOrphansRequest { bool execute = 1; }

message PruneOrphansResponse {
  repeated string dirs = 1;   // workspace-relative orphan directories found
  bool executed = 2;          // true when `dirs` were actually deleted (echoes the request)
}

// --- pairing (plan M4, design §4) ---

message PairOfferRequest {}

// QR payload: identity + handshake material only, never the group key or a private key.
message PairOfferResponse {
  string device = 1;
  string group_id = 2;
  string x25519_pub = 3;
  string endpoint = 4;
  string nonce = 5;
  // "tagged" or "sidecar" (docs/questions.md Q2), this device's own. Carried so a joiner can
  // detect a mismatch against its own mode and refuse rather than guess a merge (Q6, open).
  string identity_mode = 6;
}

message PairAcceptRequest { string code = 1; }   // the scanned/decoded PairOffer, re-encoded

message PairResult { string sas = 1; }           // 6-word SAS (EFF short list); no key material

message PairConfirmRequest {}

// --- capability tokens (plan M6, design §6.2) ---

message TokenCreateRequest {
  string name = 1;
  repeated string scopes = 2;   // closed union: read/write:*/raw/project:*/context:*/file:*
  string expires = 3;           // RFC 3339; empty = no expiry
}

message Token {
  string id = 1;
  string name = 2;
  repeated string scopes = 3;
  string expires = 4;
  uint64 created_at_ms = 5;
  // Bearer secret, present only in the TokenCreate response — never returned by TokenList.
  string secret = 6;
}

message TokenListRequest {}

message TokenListResponse { repeated Token tokens = 1; }

message TokenRevokeRequest { string id = 1; }

message TokenRevokeResponse { bool revoked = 1; }

// --- activity feed (ADR 0004 oplog.db) ---

message OpLogRequest {}

message OpLogEntry {
  string principal = 1;    // "you@dev" / "agent:name@dev" / "external@dev" — same as OpSummary
  string op = 2;           // one-line human summary, same shape as OpSummary.summary
  uint64 at_ms = 3;
}

// --- devices (plan M4 tasks/sync-device-remove, tasks/model-hlc-skew-guard) ---

// How a device's last-known clock reading compares to ours (txtodo_model::Skew), shared by
// `txtodo device list` and `txtodo doctor`'s per-peer clock line.
enum SkewStatus {
  SKEW_STATUS_UNSPECIFIED = 0;
  // No clock sample from this peer yet (e.g. paired but never yet synced).
  SKEW_STATUS_UNKNOWN = 1;
  SKEW_STATUS_OK = 2;
  // The peer lags by skew_ms, more than the bound. Safe to sync with; the human is warned.
  SKEW_STATUS_BEHIND = 3;
  // The peer leads by skew_ms, more than the bound. A sync session with it is refused.
  SKEW_STATUS_AHEAD = 4;
}

// A device this workspace has paired with. `txtodo device list` and `txtodo doctor`'s per-peer
// clock line both read this one shape.
message Device {
  string id = 1;                // ULID text
  string name = 2;
  bool is_self = 3;              // this device; never removable
  bool removed = 4;
  uint32 key_epoch = 5;          // newest epoch this device is known to hold
  uint64 paired_at_ms = 6;
  uint64 last_seen_ms = 7;       // 0 = never contacted since registration
  SkewStatus skew_status = 8;
  uint64 skew_ms = 9;            // magnitude for BEHIND/AHEAD; 0 for OK/UNKNOWN
}

message DeviceListRequest {}

message DeviceListResponse { repeated Device devices = 1; }

message DeviceRemoveRequest { string id = 1; }   // ULID text

message DeviceRemoveResponse {
  bool removed = 1;              // false when the device was unknown
  bool already_removed = 2;      // true when it was removed before this call; nothing rotated
  uint32 rotated_to_epoch = 3;   // 0 when nothing rotated
  // Always present on a successful removal: the "does not un-share history" caveat (plan M4
  // tasks/sync-device-remove's own notes — a security feature the human believes does more than
  // it does is worse than no feature).
  string message = 4;
}

// --- test-only LAN sync seam (plan M4 `sync-lan-transport`) ---

message DebugSetGroupKeyRequest {
  string group_id = 1;   // decimal u128, same encoding pairing_wire.rs's group_id already uses
  string key_hex = 2;    // lowercase hex, 32 bytes (XChaCha20-Poly1305 group key)
}

message DebugSetGroupKeyResponse {}
