[package]
name = "txtodo-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "MCP tools, resources, prompts, tokens."

[dependencies]
txtodo-proto.workspace = true
txtodo-query.workspace = true
txtodo-workspace-paths.workspace = true
# https://docs.rs/rmcp — Rust SDK for the Model Context Protocol: server, stdio + Streamable HTTP
# transports (design §6.1). "macros" (default) gives tool_router/tool/tool_handler.
rmcp = { version = "3.3", default-features = false, features = [
  "macros",
  "server",
  "transport-io",
  "transport-streamable-http-server",
  # "client" is only exercised by tests/smoke.rs (an in-process reference client over an
  # in-memory duplex pipe) but Cargo unifies features across dep/dev-dep, so it's listed here.
  "client",
] }
# https://docs.rs/schemars — JSON Schema derive for tool argument structs (rmcp's #[tool] macro
# reads `JsonSchema` to build each tool's input schema).
schemars = "1"
# https://docs.rs/axum — nests rmcp's StreamableHttpService at the exact `/mcp` path (design §6.1).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# https://docs.rs/tokio — async runtime for both transports; the `txtodo-mcp` binary (main.rs)
# runs #[tokio::main], and "signal" catches SIGTERM/SIGINT for the HTTP transport's graceful stop.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "io-util",
  "io-std",
  "signal",
] }
# https://docs.rs/tokio-util — CancellationToken for graceful Streamable HTTP shutdown.
tokio-util = "0.7"
# https://docs.rs/serde — tool/resource/prompt argument (de)serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# https://docs.rs/tonic — the gRPC client dialing txtodod, same shape as txtodo-cli's client.rs.
tonic = "0.14"
# https://docs.rs/hyper-util — TokioIo adapter for the unix-socket connector (mirrors txtodo-cli).
hyper-util = "0.1"
# https://docs.rs/tower — service_fn for the custom unix-socket connector.
tower = { version = "0.5", features = ["util"] }
# https://docs.rs/jiff — today's local date for `todo_complete`'s stamp (ADR 0011: local date,
# never a time zone), same crate txtodo-cli's clock.rs uses for the same purpose.
jiff = "0.2"
# https://docs.rs/async-trait — McpBackend is a trait object (`Arc<dyn McpBackend>`), so its async
# fns need boxing; rmcp itself uses this crate for the same reason under its "auth" feature.
async-trait = "0.1"
# https://docs.rs/tracing — structured logs for the MCP surface (matches txtodo-daemon's setup).
tracing = "0.1"
# JSON-rolling-file + pretty-stderr tracing init, shared with every other txtodo binary (tasks/
# logging-mcp-call-span). `txtodo-mcp` is a leaf-adjacent binary crate: `.claude/budgets.json`'s
# `allowedDeps` lists this alongside txtodo-proto/txtodo-query.
txtodo-telemetry = { path = "../txtodo-telemetry" }
# Shared spawn-if-absent logic (task daemon-always-available): main.rs ensures a daemon exists
# (matching whichever target — --dir bridge or --global) before dialing it.
txtodo-daemon-launch = { path = "../txtodo-daemon-launch" }

[dev-dependencies]
# https://docs.rs/tempfile — scratch unix sockets for the in-process transport smoke test.
tempfile = "3"
# https://docs.rs/tracing-subscriber — only `tests/smoke.rs`'s `mcp_call_span_*` test needs this:
# `txtodo_telemetry::testing::LogSink` captures bytes, but proving the `mcp.call` span's own
# fields land on a JSON line needs a `with_span_events(FmtSpan::CLOSE)` layer, which
# `txtodo_telemetry::testing::capturing_dispatch` deliberately doesn't build (it mirrors `init`'s
# production layer, which never enables span-lifecycle events). Same workspace version/features
# `txtodo-daemon`/`txtodo-telemetry` already use.
tracing-subscriber = { workspace = true }
# https://docs.rs/rmcp/latest/rmcp/transport/streamable_http_client/ — rmcp's stock Streamable
# HTTP client, only for `tests/sdk_client.rs` (task mcp-sdk-smoke: a stock SDK client against the
# real server, so protocol drift fails a test). Test-only, never in the shipped binary. The
# `-reqwest` feature pulls reqwest with default features off and no TLS backend (plain
# http://127.0.0.1 only), so it adds no TLS stack. Features here unify with [dependencies]' rmcp.
# https://docs.rs/crate/rmcp/latest/features
rmcp = { version = "3.3", default-features = false, features = [
  "transport-streamable-http-client-reqwest",
] }
# https://docs.rs/tokio/latest/tokio/process/ — `tests/sdk_client.rs` spawns the real `txtodo-mcp
# --stdio` binary and talks to its piped stdin/stdout. Named here rather than relied on through
# txtodo-daemon-launch's own tokio features, which could change under us.
tokio = { version = "1", features = ["process", "time"] }

[lints]
workspace = true
