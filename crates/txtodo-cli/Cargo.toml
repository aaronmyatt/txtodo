[package]
name = "txtodo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The txtodo CLI: todo.sh-compatible commands."

[[bin]]
name = "txtodo"
path = "src/main.rs"

[dependencies]
txtodo-core.workspace = true
txtodo-proto.workspace = true
# https://docs.rs/clap/latest/clap/_derive/index.html
clap = { version = "4", features = ["derive"] }
# https://docs.rs/toml/latest/toml/ — config.toml
toml = "1"
serde = { version = "1", features = ["derive"] }
# https://docs.rs/jiff — the local calendar date for creation/completion stamps (plan §1 decision 11)
jiff = "0.2"
# https://docs.rs/getrandom — the 80 random bits of a ULID
getrandom = "0.3"

[dev-dependencies]
# https://docs.rs/tempfile — every test gets its own todo dir
tempfile = "3"

[lints]
workspace = true
