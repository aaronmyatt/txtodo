[package]
name = "txtodo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The txtodo CLI: todo.sh-compatible commands."

[[bin]]
name = "txtodo"
path = "src/main.rs"

[dependencies]
txtodo-core.workspace = true
txtodo-proto.workspace = true
# JSON-rolling-file + pretty-stderr tracing init, shared with every other txtodo binary (root
# todo.txt `logging-cli`; `.claude/budgets.json`'s `allowedDeps` lists this for the cli slice).
# Used only when $TXTODO_LOG is set — see `main.rs::init_telemetry` for the CLI's own sink matrix.
txtodo-telemetry = { path = "../txtodo-telemetry" }
# https://docs.rs/tracing — the `cli.command` span and the mode-decision/mutation-plan events.
tracing = "0.1"
# https://docs.rs/tracing-subscriber — the CLI's own default-quiet, stderr-only, warn+ layer
# (`main.rs::init_telemetry`); `txtodo_telemetry::init` builds the TXTODO_LOG-driven pair instead.
tracing-subscriber = { workspace = true }
# https://docs.rs/clap/latest/clap/_derive/index.html
clap = { version = "4", features = ["derive"] }
# https://docs.rs/toml/latest/toml/ — config.toml
toml = "1"
serde = { version = "1", features = ["derive"] }
# https://docs.rs/jiff — the local calendar date for creation/completion stamps (plan §1 decision 11)
jiff = "0.2"
# https://docs.rs/getrandom — the 80 random bits of a ULID
getrandom = "0.3"
# https://docs.rs/tonic — gRPC client to txtodod over the unix socket (ADR 0006); current-thread runtime
tonic = "0.14"
# https://docs.rs/prost — encodes the WorkspaceSelector carried in BundleImport's request metadata
# (its request type is fixed to the streamed BundleChunk, so there's no per-call field for it)
prost = "0.14"
tokio = { version = "1", features = ["rt", "net", "sync"] }
# https://docs.rs/tokio-stream — ReceiverStream, the client-streaming request body for
# `txtodo bundle import` (plan M8 `cli-bundle`)
tokio-stream = "0.1"
# https://docs.rs/hyper-util — TokioIo adapter for the unix-socket connector
hyper-util = "0.1"
# https://docs.rs/tower — service_fn for the custom connector
tower = { version = "0.5", features = ["util"] }
# https://docs.rs/tempfile — daemon mode runs each command against a scratch copy, then sends the diff
tempfile = "3"
# https://docs.rs/qrcode — `txtodo pair`'s terminal QR; default features pull in `image`/`svg`/`pic`
# render backends this CLI never uses (it only prints Unicode block glyphs), so they're off.
qrcode = { version = "0.14", default-features = false }
# https://docs.rs/serde_json — the `txtodo pair` code/QR payload text (plan M4, design §4)
serde_json = "1"

[dev-dependencies]

[lints]
workspace = true
