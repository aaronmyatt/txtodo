[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri", "relay"]
exclude = ["crates/txtodo-core/fuzz"]   # cargo-fuzz crate: nightly-only, built via `just fuzz`

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[workspace.dependencies]
txtodo-core      = { path = "crates/txtodo-core" }
txtodo-query     = { path = "crates/txtodo-query" }
txtodo-model     = { path = "crates/txtodo-model" }
txtodo-store     = { path = "crates/txtodo-store" }
txtodo-crdt      = { path = "crates/txtodo-crdt" }
txtodo-sync      = { path = "crates/txtodo-sync" }
txtodo-proto     = { path = "crates/txtodo-proto" }
txtodo-mcp       = { path = "crates/txtodo-mcp" }
txtodo-telemetry = { path = "crates/txtodo-telemetry" }
# Shared "make sure txtodod exists" spawn/service logic (task daemon-always-available), used by
# txtodo-cli, txtodo-tui, txtodo-mcp and apps/desktop/src-tauri.
txtodo-daemon-launch = { path = "crates/txtodo-daemon-launch" }
# Shared device-global daemon state paths (registry/socket/pid/log dir; task
# daemon-paths-shared-crate), used by txtodo-daemon, txtodo-cli, txtodo-mcp and apps/desktop/src-tauri.
txtodo-workspace-paths = { path = "crates/txtodo-workspace-paths" }
# https://docs.rs/tracing — event/span macros; pinned here so txtodo-telemetry (workspace-deps-only,
# like txtodo-core) and every future crate can share one version instead of drifting per-Cargo.toml.
tracing = "0.1"
# https://docs.rs/tracing-subscriber — JSON + EnvFilter, same features txtodo-daemon already used.
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# https://docs.rs/tracing-appender — daily rolling file writer, non-blocking.
tracing-appender = "0.2"

# Lint policy. Numbers live in clippy.toml; both are generated by /setup from .claude/budgets.json.
# Lint index: https://rust-lang.github.io/rust-clippy/master/index.html
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
too_many_lines = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
cognitive_complexity = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
