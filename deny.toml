# Generated by /setup. Frozen path. Ref: https://embarkstudios.github.io/cargo-deny/checks/index.html
[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Zlib", "MPL-2.0",
         # CC0-1.0: public-domain dedication; needed by `notify` (plan M3 watcher). Added 2026-09-11.
         "CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
