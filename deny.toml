[advisories]
# loro (ADR 0002) pulls im/sized-chunks/bitmaps, all unmaintained with no safe upgrade (repos
# archived 2026-05-03). atomic-polyfill is pre-existing via postcard → heapless 0.7. None has a
# known vulnerability. Narrowest scope: these four IDs only. Recorded in RATCHET.md (2026-09-12).
