# .github/workflows/release.yml — tag-triggered release: cross-compiled binaries via
# cargo-zigbuild, an SBOM (cargo-cyclonedx), Sigstore keyless signing (cosign), a Nix build check
# (builds and runs --version), and a GitHub Release carrying all of it.
# Design §11/§12; tasks/release-engineering/notes.md.
#
# ADR 0010 (no Unix domain sockets on Windows) already drops txtodo-cli/txtodo-daemon/txtodo-mcp
# from the Windows leg of ci.yml's own matrix — this workflow mirrors that exactly: the
# windows-gnu leg below builds ONLY txtodo-tui via `-p txtodo-tui`, never a workspace-wide
# zigbuild. Ship-only-tui-on-Windows is a deliberate, revisitable default — see the "Decision
# needed" note at the bottom of this file.
#
# GitHub Actions syntax: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # gh release create: https://cli.github.com/manual/gh_release_create
  id-token: write   # cosign keyless signing via GitHub OIDC: https://docs.sigstore.dev/cosign/keyless/

jobs:
  # Releases are append-only (notes.md invariant: "nothing rewrites a published asset or its
  # signature"). Fail loudly on a duplicate tag instead of silently overwriting one.
  reject-duplicate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fail if this tag already has a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::release ${{ github.ref_name }} already exists — releases are immutable, bump the tag"
            exit 1
          fi

  # Cross-compiled binaries. Every non-native leg below runs on ubuntu-latest and cross-compiles
  # via cargo-zigbuild (https://github.com/rust-cross/cargo-zigbuild) — zig ships its own C
  # toolchain/sysroots, so musl and windows-gnu targets need nothing per-target installed on the
  # runner. macOS builds natively (Xcode's own linker cross-links x86_64 from an arm64 runner).
  build:
    needs: reject-duplicate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc: pin an old glibc (2.17, RHEL7-era) for portability — cargo-zigbuild's own
          # glibc-version-suffix convention: https://github.com/rust-cross/cargo-zigbuild#specify-glibc-version
          - leg: linux-x86_64-gnu
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            packages: "txtodo-cli txtodo-daemon txtodo-mcp txtodo-tui"
            native: false
            static_check: false
          # Linux musl: fully static — no libc at all — verified below via `ldd` (expect "not a
          # dynamic executable", i.e. no interpreter, on every artifact).
          - leg: linux-x86_64-musl
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
            packages: "txtodo-cli txtodo-daemon txtodo-mcp txtodo-tui"
            native: false
            static_check: true
          - leg: linux-aarch64-musl
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-musl
            zig_target: aarch64-unknown-linux-musl
            packages: "txtodo-cli txtodo-daemon txtodo-mcp txtodo-tui"
            native: false
            static_check: true
          # Windows: ADR 0010 (no Unix domain sockets on Windows) already drops txtodo-cli,
          # txtodo-daemon and txtodo-mcp from ci.yml's Windows leg — mirror that here. Ship ONLY
          # txtodo-tui on Windows for now (see "Decision needed" below).
          - leg: windows-x86_64-gnu
            os: ubuntu-latest
            rust_target: x86_64-pc-windows-gnu
            # Same as rust_target, not a typo left in: unlike the glibc legs above, windows-gnu
            # has no glibc-version-suffix convention to apply, and "x86_64-windows-gnu" (missing
            # the "pc" vendor component) is not a real target triple at all — cargo/rustc refused
            # it outright ("could not find specification for target") on this project's first
            # real release run.
            zig_target: x86_64-pc-windows-gnu
            packages: "txtodo-tui"
            native: false
            static_check: false
          # macOS: native toolchain, no zig.
          - leg: macos-aarch64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            packages: "txtodo-cli txtodo-daemon txtodo-mcp txtodo-tui"
            native: true
            static_check: false
          - leg: macos-x86_64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            packages: "txtodo-cli txtodo-daemon txtodo-mcp txtodo-tui"
            native: true
            static_check: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The date every binary shows beside its version (task version-info). The tagged commit's
      # own date, so two builds of one tag agree; build-support/buildinfo.rs reads the variable.
      # https://docs.github.com/en/actions/reference/workflow-commands-for-github-actions#setting-an-environment-variable
      - name: release date from the tagged commit
        shell: bash
        run: echo "TXTODO_RELEASE_DATE=$(git show -s --format=%cs HEAD)" >> "$GITHUB_ENV"
      # rust-toolchain.toml pins 1.95.0; the action honours it (same as ci.yml).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: rustup target add
        run: rustup target add ${{ matrix.rust_target }}

      - name: install cargo-zigbuild + zig
        if: ${{ !matrix.native }}
        # ziglang FIRST: .cargo/config.toml pins zig as the x86_64-unknown-linux-gnu linker
        # unconditionally, so `cargo install cargo-zigbuild` (a plain, un-cross-targeted `cargo
        # install`, itself compiling host-target proc-macro/build-script crates like `libc`) hits
        # that same override.
        #
        # `pip3 install ziglang` alone still isn't enough (found on this project's first real
        # release run, twice): the `ziglang` PyPI package's own installed script location isn't
        # reliably on this runner's PATH for later steps (Ubuntu 24.04's system pip3 install
        # location varies by whether it lands in a user site or a hostedtoolcache one — not worth
        # depending on either). A hand-written wrapper at a location this step explicitly adds to
        # $GITHUB_PATH (which, unlike a plain PATH export, persists to every later step in this
        # job: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#adding-a-system-path)
        # sidesteps the question of where pip put anything.
        run: |
          pip3 install ziglang
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zig" version   # fail loudly here, not three steps later
          cargo install --locked cargo-zigbuild

      - name: build (cargo-zigbuild)
        if: ${{ !matrix.native }}
        run: |
          set -euo pipefail
          for pkg in ${{ matrix.packages }}; do
            cargo zigbuild --release --target "${{ matrix.zig_target }}" -p "$pkg" --locked
          done

      - name: build (native macOS)
        if: matrix.native
        run: |
          set -euo pipefail
          for pkg in ${{ matrix.packages }}; do
            cargo build --release --target "${{ matrix.rust_target }}" -p "$pkg" --locked
          done

      # Self-sign the macOS binaries with fixed identifiers (com.txtodo.<bin>), same cert as the
      # desktop app, so the Keychain's "Always Allow" for txtodod survives upgrades. Signed before
      # `collect artifacts` renames them, so the identifier is the bare binary name.
      - name: import self-signed signing cert (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/macos-import-cert.sh
      - name: self-sign binaries (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          out="target/${{ matrix.rust_target }}/release"
          scripts/macos-selfsign.sh "$out/txtodo" "$out/txtodod" "$out/txtodo-mcp" "$out/txtodo-tui"
      - name: remove signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${TXTODO_SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$TXTODO_SIGN_KEYCHAIN" || true; fi

      # Package binaries: [[bin]] name differs from the crate name (txtodo-cli -> txtodo,
      # txtodo-daemon -> txtodod, txtodo-tui -> txtodo-tui — see each crate's Cargo.toml), and
      # Windows adds a `.exe` suffix.
      - name: collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          case "${{ matrix.rust_target }}" in
            *windows*) ext=".exe" ;;
          esac
          bin_for() {
            case "$1" in
              txtodo-cli) echo "txtodo" ;;
              txtodo-daemon) echo "txtodod" ;;
              txtodo-mcp) echo "txtodo-mcp" ;;
              txtodo-tui) echo "txtodo-tui" ;;
            esac
          }
          for pkg in ${{ matrix.packages }}; do
            bin="$(bin_for "$pkg")"
            src="target/${{ matrix.rust_target }}/release/${bin}${ext}"
            dest="dist/${bin}-${{ matrix.leg }}${ext}"
            cp "$src" "$dest"
            echo "packaged $dest"
          done

      # A "static" musl artifact that still links glibc is a known zigbuild footgun with C deps
      # (the daemon links rusqlite's bundled sqlite) — assert `ldd` reports no dynamic interpreter
      # at all, not just "no glibc found".
      - name: static-check (musl must have zero dynamic linkage)
        if: matrix.static_check
        run: |
          set -euo pipefail
          for f in dist/*; do
            echo "checking $f"
            if ldd "$f" 2>&1 | grep -qv 'not a dynamic executable'; then
              echo "::error::$f is not statically linked: $(ldd "$f")"
              exit 1
            fi
          done

      - name: smoke test (every binary runs --version)
        if: ${{ matrix.rust_target == 'x86_64-unknown-linux-gnu' || matrix.native }}
        run: |
          set -euo pipefail
          for f in dist/*; do
            out=$("./$f" --version)
            echo "$out"
            case "$out" in
              *"($TXTODO_RELEASE_DATE)"*) ;;
              *) echo "::error::$f --version does not show the release date $TXTODO_RELEASE_DATE"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.leg }}
          path: dist/*

  # apps/desktop (Tauri) .app/.dmg legs (task desktop-cask-distribution): mirrors the CLI matrix's
  # own two macOS legs above — aarch64 native, x86_64 cross-linked from the same arm64 runner via
  # Xcode's native cross-linking (`build`'s own "macos-x86_64" leg comment explains why this needs
  # no zig/cargo-zigbuild the way the Linux/Windows legs do). No Linux/Windows leg: Tauri bundles a
  # platform's own native webview (WKWebView here), so a macOS bundle is all this task's own scope
  # covers — see tasks/desktop-cask-distribution/notes.md.
  #
  # Signed with the self-signed "txtodo Self-Signed" cert (secrets APPLE_CERTIFICATE,
  # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY), not Developer ID: the Keychain's "Always
  # Allow" then survives upgrades, but Gatekeeper still rejects a browser download, which is why
  # users install via scripts/install-desktop.sh (curl sets no quarantine flag). No notarization.
  build-desktop:
    needs: reject-duplicate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: macos-aarch64
            target: aarch64-apple-darwin
            native: true
          - leg: macos-x86_64
            target: x86_64-apple-darwin
            native: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The date every binary shows beside its version (task version-info). The tagged commit's
      # own date, so two builds of one tag agree; build-support/buildinfo.rs reads the variable.
      # https://docs.github.com/en/actions/reference/workflow-commands-for-github-actions#setting-an-environment-variable
      - name: release date from the tagged commit
        shell: bash
        run: echo "TXTODO_RELEASE_DATE=$(git show -s --format=%cs HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: rustup target add
        if: ${{ !matrix.native }}
        run: rustup target add ${{ matrix.target }}
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci
      # task desktop-daemon-sidecar-bundle: a packaged desktop build has no guarantee txtodod
      # exists anywhere on the installing machine's $PATH — bundle it as a Tauri sidecar instead
      # (tauri.conf.json's bundle.externalBin: ["binaries/txtodod"]). Built for the exact same
      # target this leg's `tauri build --target` below produces, named per Tauri's
      # binary-name{-target-triple} convention (https://v2.tauri.app/develop/sidecar/) so
      # tauri-bundler picks it up and strips the suffix when it copies it into the bundle.
      - name: build + stage txtodod as this leg's Tauri sidecar
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} -p txtodo-daemon --bin txtodod --locked
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/txtodod" \
             "apps/desktop/src-tauri/binaries/txtodod-${{ matrix.target }}"
      # `tauri build`'s own `beforeBuildCommand` (tauri.conf.json) runs `npm run build` (the
      # SvelteKit frontend) for us — no separate frontend-build step needed here.
      # .app only: the dmg is built below, after re-signing, so it carries the signed bundle.
      # The APPLE_* secrets are kept out of this step on purpose — Tauri would try to import the
      # cert itself and fail, since it only looks for Apple-issued ones (scripts/macos-selfsign.sh).
      - name: tauri build (app)
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles app
      # Import the .p12 into a throwaway keychain that lives only for this job, per GitHub's recipe.
      # It must go on the search list too, or codesign can't find the identity.
      # Ref: https://docs.github.com/en/actions/use-cases-and-examples/deploying/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: import self-signed signing cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/macos-import-cert.sh
      # Bundle output lands under the *workspace* root `target/`, not apps/desktop/src-tauri's own
      # (this crate is a real Cargo workspace member) — verified locally against a real build.
      # `--target` always writes to `target/<triple>/release/bundle/...`, even for this runner's
      # own native triple (unlike a plain `cargo build`, which omits the triple segment when it
      # matches the host) — confirmed by hand for both legs, so both take the same path here.
      - name: re-sign app + bundled txtodod with fixed identifiers
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/macos-selfsign.sh "target/${{ matrix.target }}/release/bundle/macos/txtodo.app"
      # Drag-to-install layout: the app plus an /Applications symlink. UDZO = zlib-compressed.
      # Ref: https://keith.github.io/xcode-man-pages/hdiutil.1.html
      - name: build dmg (rename to this release's <bin>-<leg> convention)
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/dmg"
          ditto "target/${{ matrix.target }}/release/bundle/macos/txtodo.app" "$RUNNER_TEMP/dmg/txtodo.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname txtodo -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "dist/desktop-${{ matrix.leg }}.dmg"
          echo "packaged dist/desktop-${{ matrix.leg }}.dmg"
      - name: remove signing keychain
        if: always()
        run: |
          if [ -n "${TXTODO_SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$TXTODO_SIGN_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-${{ matrix.leg }}
          path: dist/*

  # wasm leg: txtodo-ffi's wasm-bindgen build (already M7 — design §11's WASM matrix entry).
  wasm:
    needs: reject-duplicate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      # .cargo/config.toml pins zig as the x86_64-unknown-linux-gnu linker unconditionally (its
      # own doc says this is meant for local cross-target builds, independent of the release
      # matrix's own `cargo zigbuild` invocations) — but that override still applies to *this*
      # job's host-target proc-macro/build-script compilation even though it never cross-compiles
      # anything itself, since ubuntu-latest's host triple is that same target. Found on this
      # project's first real release run: without zig on PATH, every proc-macro crate
      # (wasm-bindgen-shared, quote, proc-macro2, ...) fails to link with "exit status: 127"
      # (command not found). `build`'s own zig install already works around this; this job needs
      # the same fix even though it has no zig cross-compiling of its own to do.
      - name: install zig (works around .cargo/config.toml's host-linker override, see above)
        # `pip3 install ziglang` alone isn't enough — see the `build` job's own "install
        # cargo-zigbuild + zig" step comment for why this wrapper-plus-$GITHUB_PATH form is used
        # instead of trusting wherever pip put its own console script.
        run: |
          pip3 install ziglang
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/zig" version
      # https://github.com/rustwasm/wasm-pack
      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: build txtodo-ffi (wasm32)
        run: wasm-pack build crates/txtodo-ffi --release --target web --out-dir ../../dist-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wasm
          path: dist-wasm/*

  # SBOM: one bom.json for the release, listing every crate that ships in the three binaries
  # (+ their full dependency graph) and its license.
  #
  # cargo-cyclonedx has no workspace-wide mode (confirmed locally against the real CLI, 2026-09):
  # `cargo cyclonedx --all` writes one <crate>.cdx.json per workspace member next to its
  # Cargo.toml, each with only ITS OWN metadata.component + dep graph. deploy/release/merge-bom.jq
  # combines the release-relevant members' files into one bom.json (verified locally: 485
  # components — 11 workspace crates + 474 distinct deps — all carrying a license).
  sbom:
    needs: reject-duplicate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # https://github.com/CycloneDX/cyclonedx-rust-cargo
      - run: cargo install --locked cargo-cyclonedx
      - name: cargo cyclonedx --all (one file per workspace member)
        run: cargo cyclonedx --all --format json
      - name: merge into one release bom.json
        run: |
          set -euo pipefail
          jq -s -f deploy/release/merge-bom.jq \
            crates/txtodo-cli/txtodo-cli.cdx.json \
            crates/txtodo-daemon/txtodo-daemon.cdx.json \
            crates/txtodo-tui/txtodo-tui.cdx.json \
            crates/txtodo-core/txtodo-core.cdx.json \
            crates/txtodo-query/txtodo-query.cdx.json \
            crates/txtodo-model/txtodo-model.cdx.json \
            crates/txtodo-store/txtodo-store.cdx.json \
            crates/txtodo-crdt/txtodo-crdt.cdx.json \
            crates/txtodo-sync/txtodo-sync.cdx.json \
            crates/txtodo-proto/txtodo-proto.cdx.json \
            crates/txtodo-mcp/txtodo-mcp.cdx.json \
            > bom.json
          # sanity: every workspace crate that ships is present, and nothing lacks a license
          for c in txtodo-cli txtodo-daemon txtodo-tui txtodo-core txtodo-query txtodo-model \
                   txtodo-store txtodo-crdt txtodo-sync txtodo-proto txtodo-mcp; do
            jq -e --arg c "$c" '.components[] | select(.name == $c)' bom.json > /dev/null
          done
          jq -e '[.components[] | select(.licenses == null or .licenses == [])] | length == 0' bom.json
      - uses: actions/upload-artifact@v4
        with:
          name: bom
          path: bom.json

  # Nix check (decided 2026-09-20, option B): `nix build .#txtodo` succeeds and the result runs
  # `--version`. It does not have to hash-match the cargo-zigbuild artifact. Nix builds with
  # nixpkgs' native gcc/ld and cargo-zigbuild links with zig: two different C toolchains, so the
  # outputs are not guaranteed to be byte-identical even from the same rustc, and may never match.
  # What still holds is that two clean Nix builds of one source hash-match (checked locally, not
  # re-checked here). This job is not in `publish`'s `needs` until it has passed on one real tag.
  nix-check:
    needs: reject-duplicate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # https://github.com/cachix/install-nix-action
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix build .#txtodo (glibc, x86_64-linux)
        run: nix build .#txtodo -o nix-result
      - name: the Nix build runs --version
        run: |
          set -euo pipefail
          out=$(./nix-result/bin/txtodo --version)
          echo "$out"
          case "$out" in
            txtodo\ *) ;;
            *) echo "::error::unexpected --version output: $out"; exit 1 ;;
          esac

  # Sigstore keyless signing: publish signature + certificate to the transparency log for every
  # release artifact (binaries + bom.json). https://docs.sigstore.dev/cosign/keyless/
  sign:
    needs: [build, build-desktop, wasm, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # https://github.com/sigstore/cosign-installer
      - uses: sigstore/cosign-installer@v3
      - name: sign every binary + bom.json
        run: |
          set -euo pipefail
          # --bundle alone carries the signature + certificate (cosign 3.x deprecates the
          # separate --output-signature file): https://docs.sigstore.dev/cosign/signing/overview/
          find artifacts -type f ! -name '*.bundle' | while read -r f; do
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: artifacts/**/*.bundle

  # Publish. Binaries + bom.json + .sig/.bundle files, tag-triggered, immutable (reject-duplicate-
  # tag already ran first).
  # nix-check deliberately NOT in `needs` yet (2026-09-20): it replaces the old hash-match gate and
  # has not run on a real tag. It still runs and reports pass/fail in the Actions UI. Add it to
  # `needs` once it has passed on one real release tag.
  publish:
    needs: [build, build-desktop, wasm, sbom, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Missing on this project's first real release run: this job runs on its own fresh
      # runner (a separate VM from `sign`'s), so `cosign` isn't just already there from that
      # job — every job that shells out to it needs its own copy of this step.
      - uses: sigstore/cosign-installer@v3
      - name: verify every signature before publishing
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `sign`'s own "signatures" artifact and the original `dist-*`/`bom` artifacts are
          # separate uploads, so `download-artifact` (no `name:` filter, every artifact side by
          # side under `artifacts/`) lands them in *different* directories: a bundle sits at
          # artifacts/signatures/dist-<leg>/<file>.bundle while its real binary is one level up,
          # at artifacts/dist-<leg>/<file> -- stripping just ".bundle" from the bundle's own path
          # (as this step used to) looks for the binary in the wrong directory entirely. Strip the
          # "signatures/" prefix too to recover the real path.
          # https://github.com/sigstore/cosign-installer
          find artifacts/signatures -name '*.bundle' | while read -r bundle; do
            rel="${bundle#artifacts/signatures/}"
            f="artifacts/${rel%.bundle}"
            cosign verify-blob \
              --certificate-identity-regexp "https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/tags/.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --bundle "$bundle" \
              "$f"
          done
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $(find artifacts -type f)

# Decision needed (human, not this workflow): Windows ships ONLY txtodo-tui above, matching
# ci.yml's existing exclusion of txtodo-cli/txtodo-daemon/txtodo-mcp under ADR 0010 (no Unix
# domain sockets on Windows). That ADR is about the daemon's IPC transport, not about the CLI or
# MCP server needing a rewrite before Windows can ship them at all — a human should decide whether
# to keep tui-only on Windows indefinitely, or scope a Windows IPC transport (named pipes?) so the
# other two binaries can ship there too. This file takes the safe, ADR-consistent default and
# flags the call rather than making it.
