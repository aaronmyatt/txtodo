# apps/desktop's Playwright suite (e2e/*.spec.ts functional + e2e/visual/** light/dark visual
# regression), on a nightly cadence + manual dispatch — deliberately separate from ci.yml's
# required `desktop` job (task desktop-stack-gaps): a real Playwright browser download plus
# building the real e2e_bridge/txtodod binaries the harness spawns (see e2e/fixtures.ts) is heavy,
# and ci.yml itself is described as frozen for cost reasons — this suite must never gate every PR.
# GitHub Actions syntax: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
# Cron syntax: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
name: desktop-e2e-nightly

on:
  schedule:
    # 07:00 UTC daily — off-peak for both US and EU working hours, arbitrary otherwise.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same Tauri Linux prerequisites as ci.yml's `check`/`desktop` jobs — the harness builds a
      # real `desktop` binary (with the `e2e-bridge` feature) via cargo, which links tauri/wry.
      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci
      # https://playwright.dev/docs/ci#caching-browsers — installs browsers + their own OS deps.
      - name: install Playwright browsers
        working-directory: apps/desktop
        run: npx playwright install --with-deps
      # Functional (e2e/*.spec.ts) + visual regression (e2e/visual/**, light+dark projects) —
      # playwright.config.ts's own `projects` list is what `npm run test:e2e` (bare `playwright
      # test`, no --project filter) already runs, matching what a human runs locally for "the
      # full suite". No `--update-snapshots`: a real drift fails this job rather than silently
      # overwriting goldens (playwright.config.ts's own doc comment on this).
      - name: playwright test (functional + visual regression)
        working-directory: apps/desktop
        run: npm run test:e2e
      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          if-no-files-found: ignore
