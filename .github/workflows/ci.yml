# The outer wall: re-runs everything the hooks run, for everyone, on every push.
# Commands are the ones in .claude/budgets.json.commands (drift audit diffs them).
# GitHub Actions syntax: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# .cargo/config.toml points x86_64-unknown-linux-gnu's linker at .cargo/zig/zigcc-*.sh so that a
# dev on macOS can cross-build for Linux. On a Linux runner that triple is the *host*, so every
# native build tried to link through zig — which isn't installed there (`exec: zig: not found`,
# exit 127) and broke the ubuntu check/daemon/bench/coverage/fuzz jobs. Env vars outrank
# config.toml in cargo's config hierarchy, so this pins the runner back to its system linker
# without touching the local cross-build setup. The var is ignored on macOS/Windows runners.
# Precedence: https://doc.rust-lang.org/cargo/reference/config.html#environment-variables
# Key name mapping: https://doc.rust-lang.org/cargo/reference/config.html#target
env:
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # PR size check needs the base commit
      # rust-toolchain.toml pins 1.95.0 with rustfmt + clippy; the action honours it.
      # https://github.com/dtolnay/rust-toolchain
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tauri v2 Linux build deps (webkit2gtk, appindicator, global-shortcut's xdo, glib/gtk).
      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config

      - name: format
        run: cargo fmt --all --check
      # Windows has no unix-domain sockets (ADR 0010), so the CLI's and MCP server's daemon
      # clients and the whole txtodo-daemon crate are unix-only there; every other crate checks
      # on all three runners.
      # No separate `cargo check` step: clippy runs the same compiler passes plus its own lints,
      # and `-D warnings` here fails on rustc warnings too (a Windows-only `dead_code` once passed
      # `cargo check` as a warning and only went red a step later).
      # https://doc.rust-lang.org/clippy/usage.html
      - name: lint
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: lint (windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --exclude txtodo-cli --exclude txtodo-daemon --exclude txtodo-mcp -- -D warnings
      # --no-fail-fast on every test step: without it cargo stops at the first failing test binary
      # and hides every binary after it (a red run only ever showed one failure at a time).
      # https://doc.rust-lang.org/cargo/commands/cargo-test.html#test-options
      # The daemon's real-socket integration tests run in their own Linux job below; the matrix
      # keeps the rest fast. Windows also drops the CLI and MCP server (no unix socket).
      - name: test
        if: runner.os != 'Windows'
        run: cargo test --workspace --exclude txtodo-daemon --no-fail-fast
      - name: test (windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude txtodo-daemon --exclude txtodo-cli --exclude txtodo-mcp --no-fail-fast
      # Every real-txtodod integration test across txtodo-cli/txtodo-mcp/txtodo-tui/apps/desktop
      # is #[ignore]d (2026-09-19): each spawns a real daemon and apps/desktop's own
      # support::TXTODOD_BIN can trigger a full daemon/sync/iroh recompile under a different
      # feature resolution, measured once at ~14 minutes for 2 tests — by far the slowest tests
      # in the workspace. Kept out of the step above so a plain `cargo test` stays fast; this
      # step is the only place they run. Skipped on Windows: every file involved is
      # `#![cfg(unix)]` (ADR 0010) or already excluded above, so there is nothing to run there.
      # Named packages, not `--workspace`: other crates' #[ignore]s are deliberate and would
      # fail or crawl here (txtodo-sync's upstream-bug tests, txtodo-crdt's 1000-run `just sim`
      # sweep, txtodo-daemon-launch's simulated_reboot needing a real launchd/systemd session).
      - name: test (ignored — CI-only real-txtodod tests)
        if: runner.os != 'Windows'
        run: cargo test -p txtodo-cli -p txtodo-mcp -p txtodo-tui -p desktop --no-fail-fast -- --ignored
      - name: boundaries + file length + assertions
        if: runner.os != 'Windows'
        run: |
          .claude/scripts/check-boundaries.sh
          .claude/scripts/check-file-length.sh
          .claude/scripts/check-assertions.sh
          .claude/scripts/check-specs-mirror.sh
      - name: PR size (budgets.json.diffLines, Cargo.lock and todo.txt exempt)
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        run: |
          MAX=$(node -pe 'JSON.parse(require("fs").readFileSync(".claude/budgets.json")).diffLines')
          N=$(git diff --numstat "origin/${{ github.base_ref }}"...HEAD -- . ':!Cargo.lock' ':(exclude,glob)**/todo.txt' | awk '{a+=$1+$2} END{print a+0}')
          echo "changed lines: $N (max $MAX)"; [ "$N" -le "$MAX" ]

  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Install system packages needed to build glib-sys on the daemon job too
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev pkg-config

      - uses: Swatinem/rust-cache@v2
      - name: daemon tests
        run: cargo test -p txtodo-daemon

  no-std:
    # core must build without std (plan M1): a target with no OS proves no std:: path leaked in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `targets:` on the action would land on `stable`, but rust-toolchain.toml overrides the
      # build to 1.95.0 (E0463 in CI 2026-09-11). rustup target add follows the override.
      # https://rust-lang.github.io/rustup/overrides.html
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p txtodo-core --no-default-features --target thumbv7em-none-eabihf

  bench:
    # perf budget (plan §5): parse 100k lines ≤ budgets.json.perf.parse100kMs on this runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: .claude/scripts/check-bench.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # Tauri v2 Linux build deps, same as the check job. https://v2.tauri.app/start/prerequisites/#linux
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      # https://github.com/taiki-e/cargo-llvm-cov#continuous-integration
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Three steps, one merged number: the plain run leaves the real-txtodod tests out (they are
      # #[ignore]d, see the check job), which alone cost ~2 points of line coverage, so the
      # second run adds exactly those, and `report` gates the merged total.
      # https://github.com/taiki-e/cargo-llvm-cov#merge-coverages-generated-under-different-test-conditions
      - name: coverage (workspace)
        run: cargo llvm-cov --workspace --no-report --no-fail-fast
      - name: coverage (ignored real-txtodod tests)
        run: cargo llvm-cov -p txtodo-cli -p txtodo-mcp -p txtodo-tui -p desktop --no-report --no-fail-fast -- --ignored
      - name: coverage floor (budgets.json.coveragePercent)
        run: cargo llvm-cov report --fail-under-lines $(node -pe 'JSON.parse(require("fs").readFileSync(".claude/budgets.json")).coveragePercent')

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # https://github.com/EmbarkStudios/cargo-deny-action
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    # 60 s libFuzzer smoke on the stub target (plan M0). Nightly only: cargo-fuzz needs -Z sanitizer.
    # https://rust-fuzz.github.io/book/cargo-fuzz/setup.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/txtodo-core/fuzz -> target"
      # install-action has no cargo-fuzz manifest (the @cargo-fuzz ref resolved with an empty
      # tool, CI 2026-09-11); build it on nightly. rust-cache keeps ~/.cargo/bin between runs.
      # https://rust-fuzz.github.io/book/cargo-fuzz/setup.html
      - run: cargo +nightly install cargo-fuzz --locked
      - name: fuzz parse_line for 60 s
        run: cargo +nightly fuzz run --fuzz-dir crates/txtodo-core/fuzz parse_line -- -max_total_time=60
      - name: keep any crash input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/txtodo-core/fuzz/artifacts
          if-no-files-found: ignore

  # task desktop-stack-gaps (root todo.txt id:01M2Q3DESKTOPSTACKGAPS0001): apps/desktop had zero
  # CI coverage at all — no step ran svelte-check, vitest, or even built it, so a broken frontend
  # or a failing unit test never failed a PR. ubuntu-latest (cheaper than macOS): nothing this job
  # does needs a real macOS/Tauri runtime — svelte-check/vitest/build all run against plain
  # Node + the SvelteKit static adapter, same as a contributor's own machine. The Linux Tauri
  # system deps below are only pulled in because `npm run build`/`svelte-check` still resolve
  # `apps/desktop/src-tauri`'s own `Cargo.toml` via the vite/tauri tooling's config validation;
  # mirrors the `check` job's own "Install system dependencies (Ubuntu)" step verbatim (kept as a
  # duplicate, not factored into a reusable/composite step, matching this file's existing
  # per-job style — no composite actions are used anywhere else in this workflow).
  # Deliberately does NOT run the Playwright e2e/visual suite (see desktop-e2e-nightly.yml
  # instead): browser downloads are heavy and this file is described as cost-frozen.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Ubuntu, Tauri Linux prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      # apps/desktop/package.json has no "engines" field; Node 22 matches the version already
      # pinned in this same workflow file's sibling release.yml's build-desktop job, rather than
      # introducing a second Node version for this one app.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci
      - name: svelte-check
        working-directory: apps/desktop
        run: npm run check
      - name: vitest
        working-directory: apps/desktop
        run: npx vitest run
      - name: build (svelte-kit + static adapter)
        working-directory: apps/desktop
        run: npm run build
