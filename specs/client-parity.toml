# ==== App ==========================================================================================

[[action]]
id = "palette.open"
title = "Command palette: run any action by id"
keys = [":"]
scope = "global"
desktop = { status = "na", surface = "" }
tui = { status = "done", surface = "command line" }
deviation = "A vim-style command line is a terminal convention; desktop reaches every action by key or click."

[[action]]
id = "app.quit"
title = "Quit"
keys = []
scope = "global"
desktop = { status = "na", surface = "" }
tui = { status = "done", surface = "command line (:q)" }
deviation = "Desktop quits from the OS menu or tray; the TUI quits with :q (and Ctrl-C once tui-foundation lands)."
